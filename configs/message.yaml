seed: 42

paths:
  raw_dir: data/raw
  interim: data/interim/messages.parquet
  processed_dir: data/processed
  model_dir: models

# Source label -> project label (ham / spam / scam)
label_map:
  uci_sms:
    ham: ham
    spam: spam
  mendeley_smishing:
    ham: ham
    spam: spam
    smishing: scam

labels: [ham, spam, scam]

split:
  train: 0.70
  val: 0.15
  test: 0.15

baseline:
  word_ngram: [1, 2]
  char_ngram: [3, 5]
  min_df: 2
  C_grid: [0.01, 0.03, 0.1, 0.3, 1.0, 3.0, 10.0]
  max_iter: 2000
