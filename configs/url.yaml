seed: 42

paths:
  raw_dir: data/raw
  interim: data/interim/urls.parquet
  processed_dir: data/processed
  model_dir: models

labels: [benign, phishing]

# PhiUSIIL encodes 1 = legitimate, 0 = phishing (checked against well-known domains
# in clean_urls.py). Project label: 1 = phishing.
phiusiil_phishing_value: 0

split:
  train: 0.70
  val: 0.15
  test: 0.15

random_forest:
  n_estimators: 300
  max_depth_grid: [null, 20, 40]
  min_samples_leaf_grid: [1, 3]
  # Tuning on the full training set is slow on a laptop; subsample for the grid only.
  tune_sample: 60000
