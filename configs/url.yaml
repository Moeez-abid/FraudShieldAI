seed: 42

paths:
  raw_dir: data/raw
  interim: data/interim/urls.parquet
  processed_dir: data/processed
  model_dir: models

labels: [benign, phishing]

# PhiUSIIL encodes 1 = legitimate, 0 = phishing (checked against well-known domains
# in clean_urls.py). Project label: 1 = phishing.
phiusiil_phishing_value: 0

split:
  train: 0.70
  val: 0.15
  test: 0.15

random_forest:
  n_estimators: 300
  max_depth_grid: [null, 20, 40]
  min_samples_leaf_grid: [1, 3]
  # Tuning on the full training set is slow on a laptop; subsample for the grid only.
  tune_sample: 60000

# Feature view used by the app and threshold calibration (see url_rf.view_urls)
serving_view: mixed

# Risk-band targets on validation (see fraudshield/inference/risk.py).
# Tuned on the Hannousse slice only: it is the only full-URL data, which is what the
# app scores. (Tuning on all of val, mostly PhiUSIIL host names, put real PayPal and
# Daraz deep links in "High".)
risk_slice: hannousse
risk:
  high_precision: 0.95
  medium_max_benign_flagged: 0.15
